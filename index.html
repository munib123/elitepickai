    <!--
      Head defaults for the "/" route.

      scripts/prerender.mjs REWRITES the seven tags below per route, taking the
      values from seo.config.json, and fails the build if any of them stops
      matching exactly once. Before that existed the prerender only replaced the
      body, so all 26 generated pages shipped this head verbatim: same title, same
      description, and a canonical pointing at "/" on every URL. react-helmet-async
      does override these in a browser, but it cannot touch a file written by Node,
      which is what a crawler reads.
    -->
    <title>ElitePick AI · Data and AI engineering by Muneeb Shafiq</title>
    <meta name="description" content="The independent practice of Muneeb Shafiq, AI Engineer at Symufolk. Dashboards, retrieval systems and Python automation, built remotely from Lahore." />
    <meta name="author" content="Muneeb Shafiq" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://elitepickai.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ElitePick AI" />
    <meta property="og:title" content="ElitePick AI · Data and AI engineering by Muneeb Shafiq" />
    <meta property="og:description" content="The independent practice of Muneeb Shafiq, AI Engineer at Symufolk. Dashboards, retrieval systems and Python automation, built remotely from Lahore." />

    <meta property="og:image" content="https://elitepickai.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card. No twitter:site or twitter:creator: there is no X account. -->

    <meta name="twitter:title" content="ElitePick AI · Data and AI engineering by Muneeb Shafiq" />

    <meta name="twitter:image" content="https://elitepickai.com/og-image.jpg" />

          "jobTitle": "AI Engineer",
          "url": "https://www.muneebshafiq.me",
          "email": "mailto:muneebzehel@gmail.com",
          "worksFor": { "@type": "Organization", "name": "Symufolk" },
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Lahore",
            "addressCountry": "PK"
          },
          "sameAs": [
            "https://github.com/munib123",

            "https://www.fiverr.com/muneebisfast",
            "https://www.muneebshafiq.me"
